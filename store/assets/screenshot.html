<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #eef4fb 0%, #dbe8f6 100%);
    display: flex; align-items: center; padding: 0 70px; gap: 60px;
    color: #1d2733;
  }
  .text { flex: 1; }
  .icon { width: 72px; height: 72px; margin-bottom: 28px; }
  h1 { font-size: 46px; line-height: 1.15; letter-spacing: -0.5px; margin-bottom: 20px; }
  h1 span { color: #1064bc; }
  p { font-size: 21px; line-height: 1.5; color: #4a5866; margin-bottom: 28px; }
  ul { list-style: none; padding: 0; }
  li { font-size: 19px; line-height: 1.5; margin-bottom: 12px; padding-left: 30px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 9px; width: 16px; height: 6px; border-radius: 3px; background: #1064bc; }
  .shots { display: flex; gap: 24px; align-items: flex-start; }
  .shots img {
    height: 640px; border-radius: 12px; background: #f4f4f4;
    box-shadow: 0 18px 50px rgba(16, 60, 110, 0.22);
  }
  .shots img.oda { height: 640px; width: 245px; object-fit: cover; object-position: top; }
  .shots img.bina { margin-top: 70px; height: 560px; }
</style>
</head>
<body>
  <div class="text">
    <img class="icon" src="../../icons/icon-128.png" alt="">
    <h1>Kutucuk kutucuk değil,<br><span>aralık olarak seç.</span></h1>
    <p>sahibinden.com konut aramasında her filtrenin üstüne başlangıç–bitiş seçici ekler.</p>
    <ul>
      <li>Bina yaşı, oda sayısı, kat sayısı, bulunduğu kat</li>
      <li>Oda ve salon için ayrı aralık</li>
      <li>Veri toplamaz, açık kaynak</li>
    </ul>
  </div>
  <div class="shots">
    <img class="oda" src="oda-sayisi.png" alt="">
    <img class="bina" src="bina-yasi.png" alt="">
  </div>
</body>
</html>
